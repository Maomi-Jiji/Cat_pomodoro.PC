<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap');
body {
  font-family: 'Baloo 2', cursive;
  background: #fdf0f5; 
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden; margin: 0;
}

/* 肉球コンテナ：グリッドで重なりを防止 */
#paw-container {
  position: absolute; width: 100%; height: 100%;
  display: grid; grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(4, 1fr); z-index: 0;
}
.paw-bg { position: relative; width: 60px; height: 60px; opacity: 0.2; margin: auto; }
.pad { position: absolute; background: #ffb7c5; border-radius: 50%; }
.pad.big { width: 30px; height: 25px; left: 15px; top: 25px; }
.pad.s1 { width: 12px; height: 12px; left: 5px; top: 12px; }
.pad.s2 { width: 12px; height: 12px; left: 24px; top: 5px; }
.pad.s3 { width: 12px; height: 12px; left: 43px; top: 12px; }

/* まんまる黒猫本体 */
.cat {
  position: relative; width: 320px; height: 320px;
  background: #111; border-radius: 50%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; color: #fff;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2); z-index: 2;
}

/* 耳：サイズアップ＆ぴくぴく */
.ear {
  position: absolute; top: -35px; width: 0; height: 0;
  border-left: 50px solid transparent; border-right: 50px solid transparent;
  border-bottom: 85px solid #111;
}
.ear.left { left: 30px; transform: rotate(-25deg); animation: twitch-l 4s infinite; }
.ear.right { right: 30px; transform: rotate(25deg); animation: twitch-r 4s infinite 2s; }

@keyframes twitch-l { 0%, 90%, 100% { transform: rotate(-25deg); } 93%, 97% { transform: rotate(-40deg); } }
@keyframes twitch-r { 0%, 90%, 100% { transform: rotate(25deg); } 93%, 97% { transform: rotate(40deg); } }

/* しっぽ：ゆらゆら */
.tail {
  position: absolute; right: -40px; bottom: 60px;
  width: 100px; height: 25px; background: #111;
  border-radius: 30px; transform-origin: left center;
  animation: swish 3s infinite ease-in-out; z-index: 1;
}
@keyframes swish { 0%, 100% { transform: rotate(30deg); } 50% { transform: rotate(-10deg); } }

/* タイマー部分 */
#time { font-size: 70px; margin-bottom: 5px; }
input { border: none; border-radius: 8px; width: 50px; text-align: center; font-family: inherit; font-size: 18px; }
.controls { margin-top: 15px; }
button { font-family: inherit; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; margin: 0 2px; }
.start { background: #ff7aa2; color: #fff; }
.stop { background: #666; color: #fff; }
.reset { background: #eee; color: #333; }
</style>
</head>
<body>

<div id="paw-container"></div>

<div class="cat">
  <div class="ear left"></div>
  <div class="ear right"></div>
  <div id="time">25:00</div>
  <div><input id="minutes" type="number" value="25"> min</div>
  <div class="controls">
    <button class="start" onclick="start()">Start</button>
    <button class="stop" onclick="stopTimer()">Stop</button>
    <button class="reset" onclick="reset()">Reset</button>
  </div>
  <div class="tail"></div>
</div>

<script>
// 肉球を20個、重ならずに配置
const container = document.getElementById('paw-container');
for (let i = 0; i < 20; i++) {
  const paw = document.createElement('div');
  paw.className = 'paw-bg';
  // 角度だけランダムにして可愛さを出す
  paw.style.transform = `rotate(${Math.random() * 360}deg)`;
  paw.innerHTML = '<div class="pad big"></div><div class="pad s1"></div><div class="pad s2"></div><div class="pad s3"></div>';
  container.appendChild(paw);
}

let seconds=1500; let timer=null;
function start(){
  if(timer) return;
  seconds=document.getElementById("minutes").value*60;
  timer=setInterval(()=>{
    if(seconds<=0){ clearInterval(timer); timer=null; return; }
    seconds--;
    let m=String(Math.floor(seconds/60)).padStart(2,'0');
    let s=String(seconds%60).padStart(2,'0');
    document.getElementById("time").textContent=`${m}:${s}`;
  },1000);
}
function stopTimer(){ clearInterval(timer); timer=null; }
function reset(){ stopTimer(); let m=document.getElementById("minutes").value; document.getElementById("time").textContent=String(m).padStart(2,'0')+":00"; }
</script>
</body>
</html>
